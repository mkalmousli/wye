<style>
:root{
  --paper:#f7f6f2;--paper2:#efede6;--card:#ffffff;--ink:#0e1726;--sub:#4a5568;--line:#e2dfd6;--grid:rgba(14,23,38,.055);

}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:400 17px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
  background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
a{color:inherit}
img,svg{max-width:100%;height:auto}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;line-height:1.08;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2.5rem,5.6vw,4.4rem)}
h2{font-size:clamp(1.9rem,3.8vw,2.9rem)}
h3{font-size:1.2rem;letter-spacing:-.01em}
p{margin:0 0 1em}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.tag{display:inline-flex;align-items:center;gap:8px;font:700 .74rem/1 "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.tag::before{content:"";width:18px;height:2px;background:currentColor}
.lead{font-size:1.15rem;color:var(--sub);max-width:40em}
/* nav */
header{position:sticky;top:0;z-index:20;backdrop-filter:saturate(1.4) blur(12px);background:color-mix(in srgb,var(--paper) 82%,transparent);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:28px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font:700 1.25rem "Space Grotesk",sans-serif;text-decoration:none}
.brand img{width:32px;height:32px}
.nav ul{display:flex;gap:24px;list-style:none;margin:0 0 0 auto;padding:0}
.nav ul a{text-decoration:none;color:var(--sub);font-weight:500;font-size:.95rem}
.nav ul a:hover{color:var(--ink)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:12px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;cursor:pointer;font-size:1rem;color:var(--ink)}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.sm{padding:9px 16px;font-size:.92rem}
/* hero */
.hero{padding:64px 0 40px}
.hero .grid{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:center}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 14px}
.fine{font-size:.9rem;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:44px}
.stats div{background:var(--card);padding:18px 20px}
.stats b{display:block;font:700 1.7rem "Space Grotesk",sans-serif;letter-spacing:-.02em}
.stats span{font-size:.86rem;color:var(--sub)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px}
.flow text{font-family:"JetBrains Mono",monospace;fill:var(--sub);font-size:13px}
.flow .lbl{fill:var(--ink);font-weight:700;font-size:14px}
.flow .dev{fill:var(--paper2);stroke:var(--line);stroke-width:2}
.flow .scr{fill:#0e1726}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font:500 .8rem "JetBrains Mono",monospace;color:var(--sub)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
/* sections */
section{padding:96px 0}
.band{background:var(--paper2);border-block:1px solid var(--line)}
.dark{background:#0b1017;color:#e8ecf2;border-block:1px solid #1d2733;--card:#121a25;--line:#223041;--sub:#9aa7b8;--ink:#e8ecf2}
.head{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end;margin-bottom:44px}
.head p{margin:0}
/* demo */
.demo{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;user-select:none}
.screen{position:relative;aspect-ratio:16/10;border-radius:16px;background:#0e1726;border:10px solid #1f2937;box-shadow:var(--shadow);overflow:hidden;cursor:none;transition:outline-color .2s;outline:3px solid transparent;outline-offset:3px}
.screen.on{outline-color:var(--accent)}
.screen .bar{position:absolute;inset:0 0 auto;height:26px;background:#1a2433;display:flex;align-items:center;gap:6px;padding:0 10px;font:500 11px "JetBrains Mono",monospace;color:#9aa7b8}
.screen .bar i{width:8px;height:8px;border-radius:50%;background:#3a4656}
.screen .txt{position:absolute;left:14px;right:14px;top:40px;font:500 14px/1.6 "JetBrains Mono",monospace;color:#cfe3ff;white-space:pre-wrap;word-break:break-all}
.screen .txt::after{content:"▍";color:var(--accent2);animation:blink 1s steps(1) infinite}
.screen:not(.on) .txt::after{visibility:hidden}
.screen .cur{position:absolute;width:18px;height:18px;pointer-events:none;transform:translate(-2px,-2px);display:none}
.screen.on .cur{display:block}
.screen .name{position:absolute;right:12px;bottom:10px;font:700 11px "JetBrains Mono",monospace;color:#5f6e82}
@keyframes blink{50%{opacity:0}}
.keycap{display:grid;place-items:center;width:96px;height:96px;border-radius:18px;font:700 1.5rem "JetBrains Mono",monospace;background:linear-gradient(180deg,#fff,#e9e6dd);color:#0e1726;border:1px solid #cfcabd;box-shadow:0 6px 0 #b9b3a3,0 10px 22px rgba(0,0,0,.18);cursor:pointer;transition:transform .08s,box-shadow .08s}
.keycap:active,.keycap.press{transform:translateY(5px);box-shadow:0 1px 0 #b9b3a3,0 4px 10px rgba(0,0,0,.18)}
.keycap small{display:block;font:500 .6rem Inter,sans-serif;color:#6b7280;letter-spacing:0;margin-top:-18px}
.demohint{text-align:center;margin-top:18px;color:var(--sub);font-size:.95rem}
/* lanes */
.lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.lane{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.lane::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c)}
.lane .k{font:700 .74rem "JetBrains Mono",monospace;letter-spacing:.1em;color:var(--c);text-transform:uppercase}
.lane h3{margin:.5em 0 .4em}
.lane p{color:var(--sub);font-size:.95rem;margin:0 0 12px}
.lane ul{margin:0;padding:0;list-style:none;font:500 .82rem/1.9 "JetBrains Mono",monospace;color:var(--sub)}
.lane li::before{content:"→ ";color:var(--c)}

.wiring{display:grid;grid-template-columns:1.5fr 1fr;gap:36px;align-items:center}
.wiring .panel{padding:22px;color:var(--ink)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border:0}
.steps li::before{content:counter(s);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:700 1.1rem "Space Grotesk";background:var(--ink);color:var(--paper)}
.steps p{margin:0;color:var(--sub)}
/* science */
.sci{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}
.frame{display:flex;flex-wrap:wrap;gap:4px;margin:18px 0 8px}
.frame span{flex:1 1 auto;min-width:38px;text-align:center;padding:12px 4px 8px;border-radius:8px;font:700 .78rem "JetBrains Mono",monospace;background:#1a2433;color:#cfe3ff;position:relative}
.frame span small{display:block;font:500 .62rem "JetBrains Mono",monospace;color:#7f8ea3;margin-top:4px}
.frame .p{background:#3a2c10;color:var(--accent2)}
.frame .c{background:#10302a;color:#7be3b4}
.eq{font:500 1.05rem/1.9 "JetBrains Mono",monospace;background:#0e1726;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:14px;overflow-x:auto}
.eq b{color:var(--accent2)}
.eq em{color:#7f8ea3;font-style:normal}
.bars{margin-top:18px;display:grid;gap:10px}
.bars div{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;font:500 .82rem "JetBrains Mono",monospace;color:var(--sub)}
.bars i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.spec{width:100%;border-collapse:collapse;font-size:.95rem}
.spec th,.spec td{padding:11px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.spec th{font:500 .8rem "JetBrains Mono",monospace;color:var(--sub);width:42%;padding-right:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow)}
.note{font-size:.84rem;color:var(--sub);margin-top:10px}
/* uses */
.uses{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.use{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.use svg{width:44px;height:44px;margin-bottom:12px}
.use p{color:var(--sub);margin:0;font-size:.96rem}
/* compare */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
.tbl table{border-collapse:collapse;width:100%;min-width:680px}
.tbl th,.tbl td{padding:14px 18px;text-align:left;border-bottom:1px solid var(--line)}
.tbl thead th{font:700 1rem "Space Grotesk",sans-serif}
.tbl tbody tr:last-child td,.tbl tbody tr:last-child th{border:0}
.tbl tbody th{font-weight:500}
.tbl .us{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.y::before{content:"✓ ";color:var(--audio);font-weight:700}.n::before{content:"✕ ";color:var(--uart);font-weight:700}
.seats{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:.95rem;color:var(--sub)}
.seats button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper2);font-size:1.2rem;cursor:pointer;color:var(--ink)}
.seats output{min-width:40px;text-align:center;font:700 1.1rem "JetBrains Mono",monospace;color:var(--ink)}
.trust{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;margin-top:26px;color:var(--sub);font-size:.92rem}
/* faq */
.faq{max-width:820px}
details{border-bottom:1px solid var(--line);padding:18px 0}
summary{cursor:pointer;font:600 1.08rem Inter,sans-serif;list-style:none;display:flex;justify-content:space-between;gap:20px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:500 1.4rem "JetBrains Mono",monospace;color:var(--accent);line-height:1}
details[open] summary::after{content:"−"}
details p{color:var(--sub);margin:12px 0 0}
.final{text-align:center}
.final .ctas{justify-content:center}
footer{border-top:1px solid var(--line);padding:36px 0;color:var(--sub);font-size:.92rem}
footer .row{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center}
footer nav{display:flex;flex-wrap:wrap;gap:18px}
@media (max-width:960px){
