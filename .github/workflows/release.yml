# Tag v1.2.3 -> build the firmware once, then every app target in parallel
# (one runner per OS and CPU), sign latest.json and publish a GitHub release
# with a guide, checksums and download counts.
#
# Repository secret:
#   RELEASE_SIGNING_KEY  contents of keys/release.key
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - run: git clone --depth 1 --branch 2.1.1 --recurse-submodules --shallow-submodules https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
      - run: ./build.c firmware --pico-sdk="$RUNNER_TEMP/pico-sdk"
      - uses: actions/upload-artifact@v4
        with: { name: firmware, path: out/firmware/*.uf2 }

  app:
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: linux-x64, runner: ubuntu-22.04, file: wye-linux-x64, build: "./build.c all --werror", built: out/linux/wye }
          - { id: linux-arm64, runner: ubuntu-22.04-arm, file: wye-linux-arm64, build: "./build.c all --werror", built: out/linux/wye }
          - { id: windows-x64, runner: ubuntu-22.04, file: Wye-windows-x64.exe, build: "./build.c --target=windows --werror", built: out/windows/Wye.exe }
          - { id: macos-arm64, runner: macos-14, file: wye-macos-arm64, build: "./build.c all --werror", built: out/macos/Wye }
          - { id: macos-x64, runner: macos-15-intel, file: wye-macos-x64, build: "./build.c all --werror", built: out/macos/Wye }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: firmware, path: out/firmware }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libgl-dev mingw-w64
      - run: ${{ matrix.build }}
      - name: Stage the asset
        run: |
          mkdir dist && cp "${{ matrix.built }}" "dist/${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with: { name: "app-${{ matrix.id }}", path: "dist/${{ matrix.file }}" }

  publish:
    needs: app
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # full history for the changelog
      - uses: actions/download-artifact@v4
        with: { pattern: "app-*", path: dist, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: firmware, path: dist }
      - name: Write the manifest and the release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: python3 tools/release/manifest.py
      - name: Sign the manifest
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/release.key"
          chmod +x dist/wye-linux-x64
          dist/wye-linux-x64 --release-sign "$RUNNER_TEMP/release.key" dist/latest.json
          rm -f "$RUNNER_TEMP/release.key"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" \
            --title "Wye ${TAG#v}" --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" --latest
