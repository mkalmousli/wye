name: Feature request
description: Suggest an idea for Wye
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what's missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Wye help?
